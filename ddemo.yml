name: Auto Issue and Run Code
 
on:
  push:
    branches:
      - nithya
 
jobs:
  run-script-and-create-issue:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
 
      - name: Run a simple script
        run: echo "This is a test run!"
 
      - name: Create GitHub Issue
        uses: peter-evans/create-issue@v4
        with:
          title: "Automated Issue: Code was pushed"
          body: |
            A new push was made to the repository.
            This issue was created automatically by GitHub Actions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
